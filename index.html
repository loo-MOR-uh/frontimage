<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Daily Gallery</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    text-align:center;
    padding:40px 20px;
}

header h1{
    font-size:40px;
    margin-bottom:10px;
}

header p{
    color:#94a3b8;
}

.gallery{

    width:95%;
    max-width:1500px;
    margin:auto;

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));

    gap:20px;

    padding-bottom:50px;

}

.card{

    background:#1e293b;

    border-radius:12px;

    overflow:hidden;

    transition:.25s;

    box-shadow:0 10px 20px rgba(0,0,0,.3);

}

.card:hover{

    transform:translateY(-6px);

}

.card img{

    width:100%;
    height:260px;

    object-fit:cover;

    display:block;

}

.info{

    padding:15px;

}

.info h3{

    margin-bottom:8px;

    font-size:18px;

}

.info p{

    color:#cbd5e1;

    font-size:14px;

}

.loading{

    text-align:center;

    font-size:22px;

    padding:60px;

}

footer{

    text-align:center;

    padding:30px;

    color:#94a3b8;

}

</style>

</head>

<body>

<header>

<h1>🎨 AI Daily Gallery</h1>

<p>25 AI images generated every day</p>

</header>

<div id="gallery" class="gallery">

<div class="loading">
Loading images...
</div>

</div>

<footer>

Made with ❤️ using n8n + GitHub Pages

</footer>

<script>

const gallery=document.getElementById("gallery");

fetch("data/images.json")

.then(response=>response.json())

.then(images=>{

gallery.innerHTML="";

images.reverse().forEach(image=>{

gallery.innerHTML+=`

<div class="card">

<img src="${image.url}" alt="${image.title}" loading="lazy">

<div class="info">

<h3>${image.title}</h3>

<p>${image.date}</p>

</div>

</div>

`;

});

})

.catch(error=>{

gallery.innerHTML=`
<div class="loading">

Unable to load images.

</div>
`;

console.error(error);

});

</script>

</body>
</html>
