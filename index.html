<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Gallery</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0f1115; color: #e7e9ee; }
    header { padding: 32px 20px 12px; text-align: center; }
    header h1 { margin: 0 0 6px; font-size: 1.6rem; }
    header p { margin: 0; opacity: .6; font-size: .9rem; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); padding: 20px; max-width: 1400px; margin: 0 auto; }
    .card { margin: 0; background: #1a1d24; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
    .card img { width: 100%; height: 200px; object-fit: cover; display: block; transition: transform .2s ease; }
    .card a:hover img { transform: scale(1.04); }
    figcaption { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; font-size: .82rem; }
    figcaption .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    figcaption .d { opacity: .55; flex: none; }
    footer { text-align: center; padding: 20px; opacity: .5; font-size: .8rem; }
    .empty { text-align: center; padding: 60px 20px; opacity: .6; }
  </style>
</head>
<body>
  <header>
    <h1>Image Gallery</h1>
    <p>1 images &middot; updated 2026-07-30 17:25</p>
  </header>
  <main class="grid">
    <figure class="card">
      <a href="images/2026-07-30/image-2026-07-30-01.webp" target="_blank" rel="noopener">
        <img src="images/2026-07-30/image-2026-07-30-01.webp" alt="Image 1" loading="lazy" />
      </a>
      <figcaption><span class="t">Image 1</span><span class="d">2026-07-30</span></figcaption>
    </figure>
  </main>
  <footer>Generated automatically by n8n</footer>
</body>
</html>
